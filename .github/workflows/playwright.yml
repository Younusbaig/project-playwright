name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # Checkout source code
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Setup Node
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------
      # Install Playwright
      # -----------------------------
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # -----------------------------
      # Run tests
      # -----------------------------
      - name: Run Playwright tests
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test

      # -----------------------------
      # Playwright HTML report
      # -----------------------------
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # -----------------------------
      # Upload raw Allure results
      # -----------------------------
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      # -----------------------------
      # Get previous Allure history
      # -----------------------------
      - name: Get previous Allure history
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      # -----------------------------
      # Generate Allure report
      # -----------------------------
      - name: Generate Allure report
        if: ${{ !cancelled() }}
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 20

      # -----------------------------
      # Verify Allure report
      # -----------------------------
      - name: Verify Allure report
        if: ${{ !cancelled() }}
        run: |
          echo "Checking Allure report..."

          if [ ! -f "allure-history/index.html" ]; then
            echo "ERROR: Allure index.html not found"
            exit 1
          fi

          echo "SUCCESS: Allure index.html exists"

          echo "Report files:"
          find allure-history -maxdepth 2 -type f | head -50

      # -----------------------------
      # Deploy Allure to GitHub Pages
      # -----------------------------
      - name: Deploy Allure report
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Preparing GitHub Pages deployment..."

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create temporary deployment directory
          mkdir -p /tmp/allure-deploy

          # Copy generated Allure report
          cp -R allure-history/. /tmp/allure-deploy/

          cd /tmp/allure-deploy

          # Initialize git repository
          git init

          # Create gh-pages branch
          git checkout --orphan gh-pages

          # Add files
          git add .

          # Commit
          git commit -m "Deploy Allure report"

          # Push gh-pages branch
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

          echo "Allure report deployed successfully!"