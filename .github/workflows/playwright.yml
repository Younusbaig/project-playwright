name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # Checkout source code
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Setup Node
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: npm ci

      # -----------------------------
      # Install Playwright
      # -----------------------------
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # -----------------------------
      # Run tests
      # -----------------------------
      - name: Run Playwright tests
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npx playwright test

      # -----------------------------
      # Playwright HTML report
      # -----------------------------
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # -----------------------------
      # Upload raw Allure results
      # -----------------------------
      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      # -----------------------------
      # Get previous Allure history
      # -----------------------------
      - name: Get previous Allure history
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      # -----------------------------
      # Generate Allure report
      # -----------------------------
      - name: Generate Allure report
        if: ${{ !cancelled() }}
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 20

      # -----------------------------
      # Verify Allure report
      # -----------------------------
      - name: Verify Allure report
        if: ${{ !cancelled() }}
        run: |
          echo "Checking Allure report..."

          if [ ! -f "allure-history/index.html" ]; then
            echo "ERROR: Allure index.html not found"
            exit 1
          fi

          echo "SUCCESS: Allure index.html exists"

          echo "Report files:"
          find allure-history -maxdepth 2 -type f | head -50

      # -----------------------------
      # Deploy Allure to GitHub Pages
      # -----------------------------
      - name: Deploy Allure report to Cloudflare Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy allure-history --project-name=project-playwright-allure
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}